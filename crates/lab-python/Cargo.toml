[package]
# Named for its directory. The wheel this crate is built into is published to
# PyPI as `lab-compiler`; the crate itself is never published to crates.io.
# The Rust compiler and IR implementation these bindings wrap is `lab-lair`.
name = "lab-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the Lab Compiler."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
lab-lair.workspace = true
lab-method.workspace = true
lab-project.workspace = true
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
