[package]
# Named for its directory. The wheel this crate is built into is published to
# PyPI as `lab-compiler`; the crate itself is never published to crates.io.
# The Rust compiler, facility planner, and adapter contracts these bindings wrap
# are owned by `lab-lair`, `lab-facility`, and `lab-adapters` respectively.
name = "lab-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the Lab Compiler."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
lab-adapters.workspace = true
lab-facility.workspace = true
lab-lair.workspace = true
lab-project.workspace = true
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
