[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "lab-sdk"
version = "0.1.0"
description = "Python SDK for compiling biological specifications with Lab"
requires-python = ">=3.11"
license = "Apache-2.0"

[dependency-groups]
dev = [
  "maturin>=1.13,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.maturin]
python-source = "python"
module-name = "lab._native"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
