[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

# The distribution is `lab-compiler` and the package it installs is `lab`,
# because the thing being distributed is the compiler and the thing being
# imported is the language. Keep the version in step with the Cargo
# workspace: the release workflow checks the tag against it once, and the
# wheels and the CLI binaries ship from that same tag.
[project]
name = "lab-compiler"
version = "0.1.2"
description = "The Lab compiler: designs as pySBOL3 components, circuits as LOICA networks, checked end to end"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mike Arpaia" }]
keywords = [
  "synthetic-biology",
  "sbol",
  "loica",
  "compiler",
  "laboratory-automation",
  "protocols",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://lab-lang.org"
Documentation = "https://lab-lang.org/docs/overview"
Repository = "https://github.com/lab-lang/lab"
Issues = "https://github.com/lab-lang/lab/issues"

# The SDK reads pySBOL3 components and LOICA networks structurally, so
# neither library is required at runtime; the extra installs the pair the
# examples are written with.
[project.optional-dependencies]
bio = [
  "sbol3>=1.2,<2",
  "loica>=1.0,<2",
]

[dependency-groups]
dev = [
  "maturin>=1.13,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "sbol3>=1.2,<2",
  "loica>=1.0,<2",
]

[tool.maturin]
python-source = "python"
module-name = "lab._native"
features = ["pyo3/extension-module"]
# The working tree carries bytecode from the editable install used to run the
# tests, and none of it belongs in a wheel built from that tree.
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python", "tests"]

[[tool.mypy.overrides]]
module = ["sbol3.*", "loica.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
