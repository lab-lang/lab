[package]
name = "lab-runtime"
description = "Interpreters for Lab's reviewed run documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Live hardware access: USB transport for the Hamilton STAR. Dry runs never
# need this, so document-only consumers do not link libusb.
hardware = ["hamilton-star/usb"]

[dependencies]
anyhow = { workspace = true }
hamilton-star = { workspace = true }
lab-instruments = { workspace = true }
lab-runfmt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
