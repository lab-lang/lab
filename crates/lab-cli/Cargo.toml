[package]
name = "lab-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The CLI for designing, building, and operating Lab workflows."

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
flate2 = "1.1.9"
lab-compiler.workspace = true
# The runner needs the live USB transport the workspace dependency keeps
# off by default.
lab-hamilton-star = { workspace = true, features = ["usb"] }
lab-package.workspace = true
lab-project.workspace = true
self-replace = "1.5.0"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
toml.workspace = true
ureq = "3.3.0"

[lints]
workspace = true
