[package]
name = "lab-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The CLI for designing, building, and operating Lab workflows."

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
flate2 = "1.1.9"
lab-adapters.workspace = true
lab-facility.workspace = true
lab-compiler.workspace = true
lab-capability.workspace = true
lab-inventory.workspace = true
lab-language.workspace = true
lab-runfmt.workspace = true
# The runner needs the live USB transport the workspace dependency keeps
# off by default.
lab-runtime = { workspace = true, features = ["hardware"] }
lab-package.workspace = true
lab-project.workspace = true
self-replace = "1.5.0"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4.46"
tempfile = "3.27.0"
toml.workspace = true
typst.workspace = true
typst-kit.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
ureq = "3.3.0"

[lints]
workspace = true
