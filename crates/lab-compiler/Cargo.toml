[package]
name = "lab-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Lab Compiler biological lowering pipeline for the Lab ecosystem."

[lib]
name = "lab_compiler"
path = "src/lib.rs"

[[bin]]
name = "labc"
path = "src/bin/labc/main.rs"

[[bin]]
name = "lab-opt"
path = "src/bin/lab-opt/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# The compiler consumes only the pure protocol layer: planning and frame
# encoding never link libusb (the workspace dependency keeps default
# features off).
hamilton-star.workspace = true
lab-instruments.workspace = true
lab-language.workspace = true
opentrons-protocol.workspace = true
pliron.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

[lints]
workspace = true
