[project]
name = "lab-opentrons-ot2-adapter"
version = "0.1.0"
description = "Maintained Python implementation for Lab's Opentrons OT-2 backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "opentrons==8.8.2",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
