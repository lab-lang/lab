name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match" \
              "workspace.package.version $version" >&2
            exit 1
          fi

  build:
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p lab-cli -p lab-compiler

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          asset="lab-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "$dir" lab labc lab-opt
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$asset" > "$asset.sha256"
          else
            sha256sum "$asset" > "$asset.sha256"
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          $asset = "lab-${{ matrix.target }}.tar.gz"
          tar -czf $asset -C $dir lab.exe labc.exe lab-opt.exe
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          # LF, not Out-File's CRLF, so SHA256SUMS has one line ending once
          # every target's .sha256 file is concatenated together.
          [System.IO.File]::WriteAllText("$asset.sha256", "$hash  $asset`n")

      - uses: actions/upload-artifact@v4
        with:
          name: lab-${{ matrix.target }}
          path: |
            lab-${{ matrix.target }}.tar.gz
            lab-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
