[package]
name = "golden-gate-extended"
version = "0.1.0"
edition = "2026"

[build]
entry = "src/programs/panel.lab"
target = "opentrons-ot2"

[inventory]
materials = [
  "BL21",
  # BsaI states a supplier identity, so that is what an order names.
  "NEB-R0535",
  "DH5alpha",
  # The DNA parts are declared in SBOL, where a part's identity is the registry
  # record it resolves to. That record is what an order names, so it is what is
  # listed here rather than the bare symbol a Lab declaration would have used.
  "https://synbiohub.org/public/igem/B0015",
  "https://synbiohub.org/public/igem/B0034",
  "https://synbiohub.org/public/igem/GFP",
  "https://synbiohub.org/public/igem/J23101",
  "https://synbiohub.org/public/igem/J23106",
  "https://synbiohub.org/public/igem/RFP",
  "T4_DNA_ligase",
  "T4_DNA_ligase_buffer",
  "chloramphenicol",
  "nuclease_free_water",
  "pSB1C3",
  "recovery_medium",
  # The reference plasmid is ordered, so the build asks for it as stock.
  "Addgene-#134516",
]
artifacts = []
