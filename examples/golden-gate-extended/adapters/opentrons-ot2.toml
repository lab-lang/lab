# Checked implementation configuration for the exact OT-2 Asset binding in `lab.toml`.
# Facility identity, composition, and capabilities belong to `inventory/facility.ttl`; this file cannot select an Asset or adapter.
# The current lowerer still needs device-specific protocol, layout, and labware mappings. Every field has a checked default; this example writes them out to make that residual implementation boundary explicit.

[protocol]
api_level = "2.21"

[instruments.small]
model = "p20_single_gen2"
mount = "left"

[instruments.large]
model = "p300_single_gen2"
mount = "right"

[resources.sources]
model = "temperature module gen2"
slot = "1"
labware = "opentrons_24_aluminumblock_nest_1.5ml_snapcap"
capacity = 24

# The thermocycler-backed work area occupies slots 7, 8, 10, and 11.
[resources.work]
model = "thermocycler module"
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
capacity = 96

[resources.small_tips]
labware = "opentrons_96_tiprack_20ul"
slots = ["2"]
capacity = 96

[resources.large_tips]
labware = "opentrons_96_filtertiprack_200ul"
slots = ["6"]
capacity = 96
