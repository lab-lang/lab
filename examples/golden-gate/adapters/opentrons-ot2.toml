# Checked implementation configuration for the exact OT-2 Asset binding in `lab.toml`.
# Facility identity, composition, and capabilities belong to `inventory/facility.ttl`; this file cannot select an Asset or adapter.
# The current lowerer still needs device-specific protocol, layout, and labware mappings. Every field has a checked default; this example writes them out to make that residual implementation boundary explicit.

[protocol]
api_level = "2.21"

# Facility-reviewed realization parameters for portable Procedure techniques.
[techniques]
aspiration_rate = 0.5
dispense_rate = 1.0
tracked_source_volume_ul = 10000
tracked_meniscus_offset_mm = 10.0
tracked_usable_depth_offset_mm = 10.0
tracked_minimum_height_mm = 3.0
tracked_low_volume_fraction = 0.2
tracked_chunk_size = 8
distribution_disposal_volume_ul = 4
above_liquid_offset_mm = 2.0
material_surface_offset_mm = -8.0
touch_tip_radius = 0.5
touch_tip_vertical_offset_mm = -14.0
touch_tip_speed_mm_s = 20.0

[instruments.small]
model = "p20_single_gen2"
mount = "left"

[instruments.large]
model = "p300_single_gen2"
mount = "right"

[deck.temperature_module]
model = "temperature module gen2"
slot = "1"
labware = "opentrons_24_aluminumblock_nest_1.5ml_snapcap"
capacity = 24

# The Thermocycler Module GEN1 occupies slots 7, 8, 10, and 11, so it declares
# no slot of its own and nothing else may claim those.
[deck.thermocycler]
model = "thermocycler module"
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
capacity = 96

[stages.assembly.small_tips]
labware = "opentrons_96_tiprack_20ul"
slots = ["2"]
capacity = 96

[stages.transformation.dna_plate]
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
slots = ["2"]
capacity = 96

[stages.transformation.source_rack]
labware = "opentrons_24_tuberack_eppendorf_1.5ml_safelock_snapcap"
slot = "3"
capacity = 24

[stages.transformation.small_tips]
labware = "opentrons_96_tiprack_20ul"
slots = ["9"]
capacity = 96

[stages.transformation.large_tips]
labware = "opentrons_96_filtertiprack_200ul"
slots = ["6"]
capacity = 96

# Two dilution and two agar plates. Declaring a second slot raises the batch
# size this bench can hold without editing a single program.
[stages.plating.dilution_plate]
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
slots = ["2", "3"]
capacity = 96

[stages.plating.agar_plate]
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
slots = ["5", "6"]
capacity = 96

[stages.plating.media_rack]
labware = "opentrons_15_tuberack_falcon_15ml_conical"
slot = "4"
medium_well = "A1"

[stages.plating.small_tips]
labware = "opentrons_96_filtertiprack_20ul"
slots = ["9"]
capacity = 96

[stages.plating.large_tips]
labware = "opentrons_96_filtertiprack_200ul"
slots = ["1"]
capacity = 96
