# The Flex bench this workspace can compile for. Its filename is its name:
# this is `opentrons-flex`, built by `lab build --target opentrons-flex`.
#
# Everything here describes the laboratory, not the science: which modules are
# installed, what labware sits in which deck slot, where the trash bin is, and
# which pipette is on which mount. Another laboratory running the same
# programs supplies its own profile and changes no Lab source.
#
# Every field has a default matching the reference bench, so a profile states
# only what differs. This one is written out in full because it is the
# example's subject.

[target]
backend = "opentrons.flex"

[instruments.small]
model = "p50_single_flex"
mount = "left"

[instruments.large]
model = "p1000_single_flex"
mount = "right"

[deck.temperature_module]
model = "temperatureModuleV2"
slot = "C1"
labware = "opentrons_24_aluminumblock_nest_1.5ml_snapcap"
capacity = 24

# The Thermocycler Module GEN2 installs across slots A1 and B1, so it declares
# no slot of its own and nothing else may claim those.
[deck.thermocycler]
model = "thermocyclerModuleV2"
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
capacity = 96

# The movable trash bin occupies its slot; tips are dropped into it by
# addressable area rather than into trash labware.
[deck.trash]
area = "movableTrashA3"

[stages.assembly.small_tips]
labware = "opentrons_flex_96_tiprack_50ul"
slots = ["C2"]
capacity = 96

[stages.transformation.dna_plate]
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
slots = ["C2"]
capacity = 96

[stages.transformation.small_tips]
labware = "opentrons_flex_96_tiprack_50ul"
slots = ["C3"]
capacity = 96

[stages.transformation.large_tips]
labware = "opentrons_flex_96_tiprack_1000ul"
slots = ["D2"]
capacity = 96

# Two dilution plates. Declaring a second slot raises the batch size this
# bench can hold without editing a single program.
[stages.plating.dilution_plate]
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
slots = ["C2", "C3"]
capacity = 96

[stages.plating.agar_plate]
labware = "nest_96_wellplate_100ul_pcr_full_skirt"
slots = ["B2", "B3"]
capacity = 96

[stages.plating.media_rack]
labware = "opentrons_15_tuberack_falcon_15ml_conical"
slot = "D1"
medium_well = "A1"

[stages.plating.small_tips]
labware = "opentrons_flex_96_tiprack_50ul"
slots = ["D2"]
capacity = 96

[stages.plating.large_tips]
labware = "opentrons_flex_96_tiprack_1000ul"
slots = ["D3"]
capacity = 96
