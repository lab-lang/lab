[package]
name = "golden-gate"
version = "0.1.0"
edition = "2026"

[build]
entry = "src/programs/reporter_panel.lab"

[[planning.methods]]
source-operation = "std.bio.build.realize"
method = "https://www.lab-compiler.org/ns/method#automated-golden-gate"

[inventory]
document = "inventory/facility.ttl"

[[execution.adapters]]
asset = "https://example.org/golden-gate/opentrons_ot2"
driver = "opentrons.ot2"
profile = "adapters/opentrons-ot2.toml"
