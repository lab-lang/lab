[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "lab-sdk"
version = "0.1.0"
description = "Python SDK for compiling biological specifications with Lab"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.maturin]
python-source = "python"
module-name = "lab._native"
features = ["pyo3/extension-module"]
