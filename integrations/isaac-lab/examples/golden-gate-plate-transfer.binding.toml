format = "lab.isaac-binding.v0"
task_id = "assembly_thermocycle.to-odtc-1"
calibration = "prototype-proxy"
provenance = "Scaled gripper-compatible plate proxy and hand-authored reachable poses; not measured from a real SBS plate, STAR, ODTC, or gripper."

[robot]
model = "franka-panda"
controller = "relative-ik"

[object]
shape = "cuboid"
size_m = [0.076, 0.050, 0.0144]
mass_kg = 0.12
static_friction = 0.45
dynamic_friction = 0.35

# Poses are expressed in the Franka base frame. The prototype maps the real
# station identities onto two reachable locations on one simulated table.
[source]
station = "star-1"
position_m = [0.45, -0.18, 0.043]
quaternion_wxyz = [1.0, 0.0, 0.0, 0.0]
position_jitter_m = [0.015, 0.015, 0.0]

[destination]
station = "odtc-1"
position_m = [0.45, 0.18, 0.043]
quaternion_wxyz = [1.0, 0.0, 0.0, 0.0]
position_jitter_m = [0.01, 0.01, 0.0]

[goal]
position_tolerance_m = 0.02
orientation_tolerance_rad = 0.15
max_linear_velocity_mps = 0.05
max_angular_velocity_radps = 0.20
minimum_gripper_open_m = 0.03

[simulation]
dt_seconds = 0.01
decimation = 2
episode_length_seconds = 8.0
num_envs = 256
env_spacing_m = 2.5
