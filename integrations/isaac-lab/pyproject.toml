[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lab-isaac"
version = "0.1.0"
description = "Isaac Lab adapter for backend-neutral Lab robot tasks"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
lab-isaac = "lab_isaac.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "c3/probe.py"]

[[tool.mypy.overrides]]
module = ["isaaclab.*", "isaaclab_tasks.*", "torch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
