<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab trace player</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #14161a; color: #e6e8ee;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { position: fixed; inset: 0; }
      #hud { position: fixed; left: 12px; top: 12px; right: 12px; pointer-events: none;
        display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
      .panel { background: rgba(20, 22, 26, 0.85); border: 1px solid #2a2e36;
        border-radius: 8px; padding: 10px 12px; pointer-events: auto; max-width: 44ch; }
      #attention { display: none; border-color: #d99a2b; }
      #attention.active { display: block; }
      #attention .tag { color: #d99a2b; font-weight: bold; }
      #controls { position: fixed; left: 12px; right: 12px; bottom: 12px;
        background: rgba(20, 22, 26, 0.9); border: 1px solid #2a2e36; border-radius: 8px;
        padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
      #timeline { position: relative; height: 18px; border-radius: 4px; background: #23262d;
        cursor: pointer; overflow: hidden; }
      #timeline .attention-span { position: absolute; top: 0; bottom: 0; background: #6b5416; }
      #timeline .cursor { position: absolute; top: 0; bottom: 0; width: 2px; background: #7ab2ff; }
      #transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button { background: #23262d; color: #e6e8ee; border: 1px solid #343945;
        border-radius: 5px; padding: 4px 10px; font: inherit; cursor: pointer; }
      button.on { border-color: #7ab2ff; color: #7ab2ff; }
      #drop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(12, 13, 16, 0.92); z-index: 10; text-align: center; }
      #drop.hidden { display: none; }
      .dim { color: #8b93a3; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="panel">
        <div id="clock">t+00:00:00</div>
        <div id="caption" class="dim">—</div>
      </div>
      <div class="panel" id="attention">
        <div class="tag">operator needed</div>
        <div id="attention-text"></div>
      </div>
      <div class="panel" id="summary"></div>
    </div>
    <div id="controls">
      <div id="timeline"><div class="cursor" id="cursor"></div></div>
      <div id="transport">
        <button id="play">play</button>
        <span class="dim">speed</span>
        <button data-speed="1">1×</button>
        <button data-speed="10">10×</button>
        <button data-speed="60" class="on">60×</button>
        <button data-speed="600">600×</button>
        <span id="status" class="dim"></span>
      </div>
    </div>
    <div id="drop">
      <div>
        <p><strong>Lab trace player</strong></p>
        <p class="dim">Drop a <code>scene.json</code> and a <code>sim-trace.json</code> here<br />
        (both at once or one after the other), produced by<br />
        <code>lab scene &lt;wave&gt;</code> and <code>lab simulate &lt;wave&gt;</code>.</p>
        <p class="dim" id="drop-status"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
