[workspace]
resolver = "2"
members = [
    "crates/lab-byonoy",
    "crates/lab-cli",
    "crates/lab-compiler",
    "crates/lab-ide",
    "crates/lab-ide-wasm",
    "crates/lab-inheco-odtc",
    "crates/lab-instruments",
    "crates/lab-language",
    "crates/lab-language-server",
    "crates/lab-package",
    "crates/lab-project",
    "crates/lab-stations",
    "crates/lab-python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/lab-lang/lab"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hidapi = "2"
quick-xml = "0.41.0"
# The ODTC speaks plain HTTP with no TLS, so the default rustls stack and
# gzip support stay out of the build.
ureq = { version = "3.3.0", default-features = false }
pyo3 = { version = "0.28.3", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusb = "0.9"
semver = "1"
thiserror = "2"
toml = "0.8"
lsp-server = "0.7"
lsp-types = "0.97"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Pin the post-0.16 pass infrastructure until it is available in a release.
pliron = { git = "https://github.com/pliron-org/pliron", rev = "a4390be145f151b1a18a0c0e64a0f1137f091b91" }

# Default features stay off at the workspace level so pure protocol use
# never links the native HID library; a runner re-enables `hid`.
lab-byonoy = { path = "crates/lab-byonoy", version = "0.1.0", default-features = false }
lab-compiler = { path = "crates/lab-compiler", version = "0.1.0" }
# Default features stay off at the workspace level so the compiler's pure
# protocol use never links libusb; the CLI runner re-enables `usb`.
hamilton-star = { version = "0.1.0", default-features = false }
lab-ide = { path = "crates/lab-ide", version = "0.1.0" }
lab-inheco-odtc = { path = "crates/lab-inheco-odtc", version = "0.1.0" }
lab-ide-wasm = { path = "crates/lab-ide-wasm", version = "0.1.0" }
lab-instruments = { path = "crates/lab-instruments", version = "0.1.0" }
lab-language = { path = "crates/lab-language", version = "0.1.0" }
lab-language-server = { path = "crates/lab-language-server", version = "0.1.0" }
opentrons-protocol = "0.1.0"
lab-package = { path = "crates/lab-package", version = "0.1.0" }
lab-project = { path = "crates/lab-project", version = "0.1.0" }
lab-stations = { path = "crates/lab-stations", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
