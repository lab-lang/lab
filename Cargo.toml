[workspace]
resolver = "2"
members = [
    "crates/lab-cli",
    "crates/lab-compiler",
    "crates/lab-ide",
    "crates/lab-ide-wasm",
    "crates/lab-language",
    "crates/lab-language-server",
    "crates/lab-package",
    "crates/lab-python",
    "crates/lab-sdk",
]
default-members = ["crates/lab-compiler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/marpaia/lab"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.28.3", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
toml = "0.8"
lsp-server = "0.7"
lsp-types = "0.97"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Pin the post-0.16 pass infrastructure until it is available in a release.
pliron = { git = "https://github.com/pliron-org/pliron", rev = "a4390be145f151b1a18a0c0e64a0f1137f091b91" }

lab-compiler = { path = "crates/lab-compiler", version = "0.1.0" }
lab-ide = { path = "crates/lab-ide", version = "0.1.0" }
lab-ide-wasm = { path = "crates/lab-ide-wasm", version = "0.1.0" }
lab-language = { path = "crates/lab-language", version = "0.1.0" }
lab-language-server = { path = "crates/lab-language-server", version = "0.1.0" }
lab-package = { path = "crates/lab-package", version = "0.1.0" }
lab-sdk = { path = "crates/lab-sdk", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
