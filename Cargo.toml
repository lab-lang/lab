[workspace]
resolver = "2"
members = [
    "crates/lab-capability",
    "crates/lab-cli",
    "crates/lab-lair",
    "crates/lab-ide",
    "crates/lab-ide-wasm",
    "crates/lab-inventory",
    "crates/lab-instruments",
    "crates/lab-language",
    "crates/lab-language-server",
    "crates/lab-method",
    "crates/lab-package",
    "crates/lab-procedure",
    "crates/lab-project",
    "crates/lab-sbol",
    "crates/lab-python",
    "crates/lab-runfmt",
    "crates/lab-runtime",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/lab-lang/lab"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hidapi = "2"
quick-xml = "0.41.0"
# The ODTC speaks plain HTTP with no TLS, so the default rustls stack and
# gzip support stay out of the build.
ureq = { version = "3.3.0", default-features = false }
pyo3 = { version = "0.28.3", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
sha2 = "0.11"
rusb = "0.9"
# SBOL 3 terms, serialization, and validation. Designs are read from and
# written to SBOL documents, so the standard's object model is the compiler's
# own rather than something a backend projects onto at the end.
sbol3 = { git = "https://github.com/SynBioDex/sbol-rs", rev = "2ecae3718ebb87dbdbf7112ed4d7f42c0155eea4" }
sbol-inventory = { git = "https://github.com/SynBioDex/sbol-rs", rev = "2ecae3718ebb87dbdbf7112ed4d7f42c0155eea4" }
semver = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
lsp-server = "0.7"
lsp-types = "0.97"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Pure-Rust typesetter linked as a library: `lab build` compiles the .typ
# protocol documents to PDF in-process, with fonts embedded in the binary —
# no system TeX, no network, no native libraries. Only the CLI links these;
# the compiler emits .typ sources and stays lean for lab-python.
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-kit = { version = "0.15", default-features = false, features = [
    "datetime",
    "embedded-fonts",
    "emit-diagnostics",
] }

# Pin the post-0.16 pass infrastructure until it is available in a release.
pliron = { git = "https://github.com/pliron-org/pliron", rev = "a4390be145f151b1a18a0c0e64a0f1137f091b91" }

# Default features stay off at the workspace level so pure protocol use
# never links the native HID library; a runner re-enables `hid`.
byonoy-hid = { version = "0.1.0", default-features = false }
lab-lair = { path = "crates/lab-lair", version = "0.1.2" }
lab-capability = { path = "crates/lab-capability", version = "0.1.2" }
# Default features stay off at the workspace level so the compiler's pure
# protocol use never links libusb; the CLI runner re-enables `usb`.
hamilton-star = { version = "0.1.0", default-features = false }
lab-ide = { path = "crates/lab-ide", version = "0.1.2" }
inheco-sila = "0.1.0"
lab-ide-wasm = { path = "crates/lab-ide-wasm", version = "0.1.2" }
lab-inventory = { path = "crates/lab-inventory", version = "0.1.2" }
lab-instruments = { path = "crates/lab-instruments", version = "0.1.2" }
lab-language = { path = "crates/lab-language", version = "0.1.2" }
lab-language-server = { path = "crates/lab-language-server", version = "0.1.2" }
lab-method = { path = "crates/lab-method", version = "0.1.2" }
opentrons-protocol = "0.1.0"
lab-package = { path = "crates/lab-package", version = "0.1.2" }
lab-procedure = { path = "crates/lab-procedure", version = "0.1.2" }
lab-project = { path = "crates/lab-project", version = "0.1.2" }
lab-runfmt = { path = "crates/lab-runfmt", version = "0.1.2" }
lab-sbol = { path = "crates/lab-sbol", version = "0.1.2" }
lab-runtime = { path = "crates/lab-runtime", version = "0.1.2" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
