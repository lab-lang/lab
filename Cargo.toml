[workspace]
resolver = "2"
members = [
    "compiler",
    "sdk/python",
    "sdk/rust",
]
default-members = ["compiler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/marpaia/lab"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.28.3", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Pin the post-0.16 pass infrastructure until it is available in a release.
pliron = { git = "https://github.com/pliron-org/pliron", rev = "a4390be145f151b1a18a0c0e64a0f1137f091b91" }

lab-sdk = { path = "sdk/rust", version = "0.1.0" }
labc = { path = "compiler", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
